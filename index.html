<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POS Highlighter · English Grammar A1–B2</title>

  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/compromise"></script>

  <style>
    html, body, #root { height: 100%; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    select { appearance: auto; }
    textarea:focus { outline: none; }
    /* ruby labels above words */
    ruby { ruby-align: center; }
    rt   { font-weight: 800; letter-spacing: 0.03em; line-height: 1.1; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    /* ═══════════════════════════════════════════════════════════
       DATA & CONSTANTS
    ═══════════════════════════════════════════════════════════ */

    const POS = {
      noun:        { color: '#D55E00', bg: '#FDEBD0', label: 'N',    name: 'Noun',        def: 'person, place, thing, or idea', ex: 'dog, city, love'           },
      verb:        { color: '#CC3333', bg: '#F5D0D0', label: 'V',    name: 'Verb',        def: 'action or state',               ex: 'run, is, think'            },
      adjective:   { color: '#0072B2', bg: '#D0E4F5', label: 'ADJ',  name: 'Adjective',   def: 'describes a noun',              ex: 'big, happy, red'           },
      adverb:      { color: '#E69F00', bg: '#FFF3D0', label: 'ADV',  name: 'Adverb',      def: 'modifies verb or adjective',    ex: 'quickly, very, often'      },
      pronoun:     { color: '#CC79A7', bg: '#F5E0ED', label: 'PRO',  name: 'Pronoun',     def: 'replaces a noun',               ex: 'he, she, they, it'         },
      preposition: { color: '#009E73', bg: '#D0F0E5', label: 'PREP', name: 'Preposition', def: 'shows relationship',            ex: 'in, on, at, with'          },
      conjunction: { color: '#56B4E9', bg: '#D8EDFA', label: 'CONJ', name: 'Conjunction', def: 'connects clauses',              ex: 'and, but, because'         },
      determiner:  { color: '#888888', bg: '#E8E8E8', label: 'DET',  name: 'Determiner',  def: 'specifies a noun',              ex: 'the, a, this, my, some'    },
      modal:       { color: '#9966CC', bg: '#EDE0F5', label: 'MOD',  name: 'Modal',       def: 'ability / possibility',         ex: 'can, should, must, might'  },
      auxiliary:   { color: '#CC6600', bg: '#F5E8D0', label: 'AUX',  name: 'Auxiliary',   def: 'helps the main verb',           ex: 'is, have, do, was'         },
    };

    const POS_ORDER = [
      'noun', 'verb', 'adjective', 'adverb', 'pronoun',
      'preposition', 'conjunction', 'determiner', 'modal', 'auxiliary',
    ];

    const LEVELS = {
      'Básico': ['noun', 'verb', 'adjective', 'determiner', 'pronoun', 'preposition', 'adverb', 'modal', 'auxiliary'],
      'Elemental': ['noun', 'verb', 'adjective', 'determiner', 'pronoun', 'preposition', 'adverb', 'modal', 'auxiliary'],
      'Intermedio': ['noun', 'verb', 'adjective', 'determiner', 'pronoun', 'preposition', 'adverb', 'modal', 'auxiliary', 'conjunction'],
      'Intermedio Alto': ['noun', 'verb', 'adjective', 'determiner', 'pronoun', 'preposition', 'adverb', 'modal', 'auxiliary', 'conjunction'],
    };

    const EXAMPLES = [
      {
        label: 'Básico — Daily Life',
        text: "My name is Anna. I am a student. I live in a small flat with my family. I have a brother and a sister. Every morning, I get up at seven o'clock and I go to work by bus. I like my job because the people are very nice.",
      },
      {
        label: 'Elemental — Travel',
        text: "Last summer, I travelled to Barcelona with my friend. We stayed in a small hotel near the beach. The weather was hotter than in our country, so we went swimming every day. We also visited some famous buildings and ate delicious food at local restaurants. I would like to go back next year.",
      },
      {
        label: 'Intermedio — Work & Hobbies',
        text: "I have been working as a graphic designer for three years, and I really enjoy it. Before I got this job, I used to work in a bookshop, which was quite boring. My manager, who is very experienced, told me that I should try to develop my skills in web design as well. If I pass the final exam, I might be offered a promotion.",
      },
      {
        label: 'Intermedio Alto — Society & Education',
        text: "It is widely acknowledged that the education system needs to be reformed if it is to meet the demands of a rapidly changing job market. Students who have been taught exclusively through traditional methods may find themselves ill-equipped for careers that require critical thinking and adaptability. Furthermore, research suggests that those who were encouraged to collaborate tend to be far more successful in professional environments.",
      },
    ];

    /* ═══════════════════════════════════════════════════════════
       NLP — TAG MAPPING & TOKENIZER
    ═══════════════════════════════════════════════════════════ */

    // Hardcoded lexicon for common function words.
    // Per-word nlp() calls lose sentence context and misclassify these
    // (e.g. capitalised "My" → Noun, "can" → Noun/Verb).
    // These words have a single, unambiguous POS in all contexts.
    const WORD_LEXICON = new Map(Object.entries({
      // personal pronouns
      i:'pronoun',  me:'pronoun',  myself:'pronoun',
      you:'pronoun', yourself:'pronoun', yourselves:'pronoun',
      he:'pronoun',  him:'pronoun',  himself:'pronoun',
      she:'pronoun', herself:'pronoun',
      it:'pronoun',  itself:'pronoun',
      we:'pronoun',  us:'pronoun',   ourselves:'pronoun',
      they:'pronoun', them:'pronoun', themselves:'pronoun',
      // possessive determiners
      my:'determiner',   your:'determiner',  his:'determiner',
      its:'determiner',  our:'determiner',   their:'determiner',
      // possessive pronouns
      mine:'pronoun', yours:'pronoun', hers:'pronoun',
      ours:'pronoun', theirs:'pronoun',
      // relative / interrogative pronouns
      who:'pronoun', whom:'pronoun', whose:'pronoun',
      // articles (determiners)
      the:'determiner', a:'determiner', an:'determiner',
      // core modals
      can:'modal',   could:'modal',  will:'modal',  would:'modal',
      shall:'modal', should:'modal', may:'modal',   might:'modal',
      must:'modal',
      // common adjectives that compromise might misclassify
      best:'adjective', better:'adjective', worst:'adjective', worse:'adjective',
    }));

    // Priority-ordered rules that map compromise's internal tag names to
    // our 10 POS categories.  Used for any word NOT found in WORD_LEXICON.
    // Tags are read from doc.json() terms (full sentence context).
    const POS_TAG_RULES = [
      ['modal',       ['Modal']],
      ['auxiliary',   ['Auxiliary']],
      ['conjunction', ['Conjunction', 'Correlative']],
      ['preposition', ['Preposition']],
      ['pronoun',     ['Pronoun', 'Possessive', 'Personal', 'Reflexive',
                       'Relative', 'Demonstrative', 'Indefinite']],
      ['determiner',  ['Determiner', 'Article']],
      ['adverb',      ['Adverb', 'Negative']],
      ['adjective',   ['Adjective', 'Comparable', 'Superlative']],
      ['verb',        ['Verb', 'PastTense', 'PresentTense', 'Gerund',
                       'Infinitive', 'Participle', 'Copula']],
      ['noun',        ['Noun', 'Plural', 'ProperNoun', 'Person',
                       'Place', 'Organization', 'Acronym']],
    ];

    function mapTagsToPos(tagObj) {
      if (!tagObj) return null;
      const tagSet = new Set(
        Array.isArray(tagObj)
          ? tagObj
          : Object.keys(tagObj).filter(k => tagObj[k] !== false)
      );
      if (tagSet.size === 0) return null;
      for (const [pos, checkTags] of POS_TAG_RULES) {
        if (checkTags.some(t => tagSet.has(t))) return pos;
      }
      return null;
    }

    // ─────────────────────────────────────────────────────────────
    // tokenizeText — main entry point
    //
    // Classification order for each word:
    //   1. WORD_LEXICON   — hardcoded, beats any NLP confusion
    //   2. doc.json() tags — sentence-context tags from compromise
    //   3. Capitalisation heuristic — unknown mid-sentence capitals
    // ─────────────────────────────────────────────────────────────
    function tokenizeText(inputText) {
      const doc = window.nlp(inputText);

      const rawTerms = [];
      doc.json().forEach(s => rawTerms.push(...(s.terms || [])));
      if (rawTerms.length === 0) return [];

      // Sentence-start indices (skip capitalisation heuristic there)
      const sentStarts = new Set();
      let newSent = true;
      rawTerms.forEach((t, i) => {
        if (newSent && t.text.trim()) { sentStarts.add(i); newSent = false; }
        if (/[.!?]$/.test((t.post || '').trimEnd())) newSent = true;
      });

      return rawTerms.map((t, i) => {
        const isPunct = /^[.,!?;:'"()\[\]{}\-–—…]+$/.test(t.text.trim());
        let pos = null;
        if (!isPunct) {
          const lower = t.text.toLowerCase();
          // 1. Hardcoded lexicon
          pos = WORD_LEXICON.get(lower) || null;
          // 2. Sentence-context tags
          if (!pos) pos = mapTagsToPos(t.tags);
          // 3. Capitalisation heuristic (proper nouns)
          if (!pos && !sentStarts.has(i)) {
            const c = t.text[0];
            if (c && c >= 'A' && c <= 'Z') pos = 'noun';
          }
        }
        return { id: i, text: t.text, pre: t.pre || '', post: t.post || '', pos, isPunct };
      });
    }

    /* ═══════════════════════════════════════════════════════════
       WORD TOKEN (auto-analysis renderer)
    ═══════════════════════════════════════════════════════════ */

    function WordToken({ text, pos, isPunct, unlocked, showLabels }) {
      // Punctuation or unknown word: plain unstyled text
      if (isPunct || !pos) {
        return <span style={{ color: '#374151' }}>{text}</span>;
      }

      const cfg = POS[pos];
      const ok  = unlocked.includes(pos);    // category unlocked for current level?
      const bg  = ok ? cfg.bg    : '#F1F5F9';
      const col = ok ? cfg.color : '#94A3B8';

      return (
        <ruby title={ok ? cfg.name : '(locked for this level)'}>
          <span style={{
            background:   bg,
            color:        col,
            padding:      '1px 5px',
            borderRadius: 5,
            fontWeight:   ok ? 500 : 400,
            cursor:       'default',
            display:      'inline-block', // prevents ruby base wrapping oddly
          }}>
            {text}
          </span>
          {showLabels && ok && (
            <rt style={{ fontSize: 9, color: col }}>
              {cfg.label}
            </rt>
          )}
        </ruby>
      );
    }

    /* ═══════════════════════════════════════════════════════════
       ANALYSIS STATS BAR
    ═══════════════════════════════════════════════════════════ */

    function AnalysisStats({ tokens, unlocked }) {
      const counts = {};
      tokens.forEach(t => {
        if (t.pos && !t.isPunct) counts[t.pos] = (counts[t.pos] || 0) + 1;
      });
      const wordCount = tokens.filter(t => !t.isPunct && t.text.trim()).length;
      const tagged    = Object.values(counts).reduce((a, b) => a + b, 0);

      return (
        <div style={{
          marginTop: 14, padding: '10px 14px',
          background: '#F8FAFC', borderRadius: 12,
          border: '1px solid #E2E8F0',
          display: 'flex', flexWrap: 'wrap', gap: 6, alignItems: 'center',
        }}>
          <span style={{ fontSize: 11, color: '#64748B', fontWeight: 600, marginRight: 2 }}>
            {tagged}/{wordCount} words tagged:
          </span>
          {POS_ORDER
            .filter(k => counts[k] > 0)
            .map(key => {
              const p  = POS[key];
              const ok = unlocked.includes(key);
              return (
                <span key={key} style={{
                  padding: '3px 10px', borderRadius: 20,
                  background: ok ? p.bg    : '#F1F5F9',
                  color:      ok ? p.color : '#94A3B8',
                  fontSize: 11, fontWeight: 700,
                  border: `1px solid ${ok ? p.color + '33' : '#E2E8F0'}`,
                }}>
                  {p.label} × {counts[key]}
                </span>
              );
            })
          }
        </div>
      );
    }

    /* ═══════════════════════════════════════════════════════════
       LEGEND ITEM
    ═══════════════════════════════════════════════════════════ */

    function LegendItem({ posKey, unlocked, isManual, isSelected, onSelect }) {
      const p        = POS[posKey];
      const clickable = isManual && unlocked;

      return (
        <div
          onClick={() => clickable && onSelect(posKey)}
          style={{
            display: 'flex', alignItems: 'flex-start', gap: 10,
            padding: '7px 8px', borderRadius: 10,
            border:     `2px solid ${isSelected ? p.color : 'transparent'}`,
            background: isSelected ? p.bg + 'BB' : 'transparent',
            opacity:    unlocked ? 1 : 0.42,
            cursor:     clickable ? 'pointer' : 'default',
            transition: 'border-color 0.15s, background 0.15s',
          }}
        >
          <div style={{
            width: 32, height: 32, borderRadius: 8, flexShrink: 0,
            background: unlocked ? p.bg    : '#F1F5F9',
            color:      unlocked ? p.color : '#94A3B8',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            fontSize: 11, fontWeight: 800, marginTop: 1,
          }}>
            {unlocked ? p.label : '🔒'}
          </div>
          <div style={{ minWidth: 0 }}>
            <div style={{ fontSize: 13, fontWeight: 700, color: unlocked ? p.color : '#94A3B8', lineHeight: 1.25 }}>
              {p.name}
            </div>
            <div style={{ fontSize: 11, color: '#64748B', marginTop: 2, lineHeight: 1.45 }}>
              {p.def}{' '}
              <span style={{ fontStyle: 'italic', color: '#94A3B8' }}>({p.ex})</span>
            </div>
          </div>
        </div>
      );
    }

    /* ═══════════════════════════════════════════════════════════
       SIDEBAR (desktop)
    ═══════════════════════════════════════════════════════════ */

    function Sidebar({ unlocked, isManual, selectedPos, onSelectPos }) {
      return (
        <aside
          className="hidden md:flex flex-col bg-white border-r border-gray-200 overflow-y-auto flex-shrink-0"
          style={{ width: 260 }}
        >
          <div style={{ padding: '18px 14px 20px' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 7, marginBottom: 4 }}>
              <div style={{ width: 3, height: 16, background: '#6366F1', borderRadius: 2 }} />
              <span style={{ fontSize: 10, fontWeight: 700, letterSpacing: '0.09em', color: '#94A3B8', textTransform: 'uppercase' }}>
                Parts of Speech
              </span>
            </div>
            <p style={{ fontSize: 10, color: '#CBD5E1', marginBottom: 14, marginLeft: 10 }}>
              {isManual ? 'Click to select a category for painting' : 'Colour reference for highlighted text'}
            </p>

            <div style={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
              {POS_ORDER.map(key => (
                <LegendItem
                  key={key}
                  posKey={key}
                  unlocked={unlocked.includes(key)}
                  isManual={isManual}
                  isSelected={selectedPos === key}
                  onSelect={onSelectPos}
                />
              ))}
            </div>

            <div style={{
              marginTop: 16, padding: '10px 12px',
              background: '#F8FAFC', borderRadius: 10,
              border: '1px solid #E2E8F0',
              fontSize: 11, color: '#64748B', lineHeight: 1.5,
            }}>
              <span style={{ fontWeight: 700, color: '#334155' }}>{unlocked.length}</span>
              {' '}of {POS_ORDER.length} categories unlocked
              {isManual && selectedPos && (
                <div style={{
                  marginTop: 8, padding: '6px 10px',
                  background: POS[selectedPos].bg,
                  color: POS[selectedPos].color,
                  borderRadius: 8, fontWeight: 700, fontSize: 12,
                }}>
                  ✏️ Painting: {POS[selectedPos].name}
                </div>
              )}
              {isManual && !selectedPos && (
                <div style={{ marginTop: 6, color: '#6366F1', fontWeight: 600 }}>
                  ↑ Select a category above
                </div>
              )}
            </div>
          </div>
        </aside>
      );
    }

    /* ═══════════════════════════════════════════════════════════
       MOBILE LEGEND BAR (bottom)
    ═══════════════════════════════════════════════════════════ */

    function MobileBar({ unlocked, isManual, selectedPos, onSelectPos }) {
      return (
        <div
          className="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200"
          style={{ zIndex: 30, boxShadow: '0 -2px 14px rgba(0,0,0,0.08)' }}
        >
          <div style={{ padding: '5px 12px 0', fontSize: 10, fontWeight: 600, color: '#94A3B8', letterSpacing: '0.05em' }}>
            {isManual ? '✏️ PAINT MODE — tap category then tap words' : '📘 PARTS OF SPEECH'}
          </div>
          <div style={{ display: 'flex', gap: 6, padding: '5px 12px 10px', overflowX: 'auto', WebkitOverflowScrolling: 'touch' }}>
            {POS_ORDER.map(key => {
              const p   = POS[key];
              const ok  = unlocked.includes(key);
              const sel = selectedPos === key;
              return (
                <button
                  key={key}
                  onClick={() => ok && isManual && onSelectPos(key)}
                  style={{
                    flexShrink: 0,
                    display: 'flex', flexDirection: 'column', alignItems: 'center',
                    padding: '6px 10px', borderRadius: 11,
                    background: ok ? p.bg    : '#F1F5F9',
                    color:      ok ? p.color : '#94A3B8',
                    border:     `2px solid ${sel ? p.color : 'transparent'}`,
                    cursor:     ok && isManual ? 'pointer' : 'default',
                    opacity:    ok ? 1 : 0.5,
                    minWidth:   50,
                    transition: 'border-color 0.12s',
                  }}
                >
                  <span style={{ fontWeight: 800, fontSize: 12 }}>{ok ? p.label : '🔒'}</span>
                  <span style={{ fontSize: 9, marginTop: 2 }}>{p.name}</span>
                </button>
              );
            })}
          </div>
        </div>
      );
    }

    /* ═══════════════════════════════════════════════════════════
       APP
    ═══════════════════════════════════════════════════════════ */

    function App() {
      const [level,       setLevel]      = useState('Básico');
      const [mode,        setMode]       = useState('auto');
      const [text,        setText]       = useState('');
      const [selectedPos, setSelectedPos] = useState(null);
      const [showLabels,  setShowLabels] = useState(true);
      // Auto-analysis state
      const [tokens,   setTokens]   = useState([]);
      const [analyzed, setAnalyzed] = useState(false);
      const [nlpError, setNlpError] = useState(null);

      const unlocked = LEVELS[level];
      const isManual = mode === 'manual';
      const canAnalyze = !!text.trim();

      /* ── Handlers ─────────────────────────────────────────── */

      const switchMode = m => {
        setMode(m);
        setSelectedPos(null);
        // Clear auto-analysis when switching modes
        setAnalyzed(false);
        setTokens([]);
        setNlpError(null);
      };

      const togglePos = k => setSelectedPos(p => p === k ? null : k);

      const handleTextChange = e => {
        setText(e.target.value);
        // Mark as dirty so the output area reverts to placeholder
        if (analyzed) {
          setAnalyzed(false);
          setTokens([]);
        }
        setNlpError(null);
      };

      const loadExample = e => {
        if (e.target.value !== '') {
          setText(EXAMPLES[+e.target.value].text);
          setAnalyzed(false);
          setTokens([]);
          setNlpError(null);
        }
        e.target.value = '';
      };

      const handleAnalyze = () => {
        if (!canAnalyze) return;
        setNlpError(null);
        try {
          const result = tokenizeText(text);
          setTokens(result);
          setAnalyzed(true);
        } catch (err) {
          console.error('NLP analysis error:', err);
          setNlpError('Analysis failed. Make sure compromise.js is loaded (requires internet).');
          setAnalyzed(false);
        }
      };

      /* ── Button styles ────────────────────────────────────── */
      const btnPrimary = active => ({
        padding: '9px 22px', borderRadius: 11, border: 'none',
        background: active ? 'linear-gradient(135deg,#6366f1,#4338ca)' : '#C7D2FE',
        color: '#fff', fontWeight: 700, fontSize: 13,
        cursor: active ? 'pointer' : 'not-allowed',
        boxShadow: active ? '0 2px 8px rgba(99,102,241,0.35)' : 'none',
        transition: 'all 0.15s', fontFamily: 'inherit',
      });
      const btnSuccess = active => ({
        padding: '9px 22px', borderRadius: 11, border: 'none',
        background: active ? '#059669' : '#A7F3D0',
        color: '#fff', fontWeight: 700, fontSize: 13,
        cursor: active ? 'pointer' : 'not-allowed',
        boxShadow: active ? '0 2px 8px rgba(5,150,105,0.3)' : 'none',
        transition: 'all 0.15s', fontFamily: 'inherit',
      });
      const btnOutline = {
        padding: '9px 18px', borderRadius: 11,
        border: '1.5px solid #E2E8F0', background: '#fff',
        color: '#475569', fontWeight: 600, fontSize: 13,
        cursor: 'pointer', fontFamily: 'inherit',
      };

      /* ── Render ───────────────────────────────────────────── */
      return (
        <div className="flex flex-col h-screen bg-slate-50">

          {/* ══ HEADER ══════════════════════════════════════════ */}
          <header
            className="flex-shrink-0 bg-white border-b border-gray-200 flex items-center justify-between"
            style={{ padding: '10px 18px', boxShadow: '0 1px 4px rgba(0,0,0,0.06)', zIndex: 10 }}
          >
            <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
              <div style={{
                width: 38, height: 38, borderRadius: 11, flexShrink: 0,
                background: 'linear-gradient(135deg,#6366f1 0%,#4338ca 100%)',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                boxShadow: '0 2px 8px rgba(99,102,241,0.4)',
              }}>
                <span style={{ color: '#fff', fontSize: 11, fontWeight: 900, letterSpacing: '-0.5px' }}>POS</span>
              </div>
              <div>
                <div style={{ fontSize: 15, fontWeight: 700, color: '#1E293B', lineHeight: 1.2 }}>
                  POS Highlighter
                </div>
                <div style={{ fontSize: 11, color: '#94A3B8' }}>
                  Identificador de Partes de la Oración · American English File
                </div>
              </div>
            </div>

            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <select
                value={level}
                onChange={e => setLevel(e.target.value)}
                style={{
                  fontSize: 14, fontWeight: 700,
                  background: '#EEF2FF', border: '1.5px solid #C7D2FE',
                  color: '#4338CA', borderRadius: 10,
                  padding: '6px 14px', cursor: 'pointer', outline: 'none',
                }}
              >
                {['Básico', 'Elemental', 'Intermedio', 'Intermedio Alto'].map(l => <option key={l} value={l}>{l}</option>)}
              </select>
            </div>
          </header>

          {/* ══ BODY ════════════════════════════════════════════ */}
          <div className="flex flex-1 overflow-hidden">

            {/* Sidebar */}
            <Sidebar
              unlocked={unlocked}
              isManual={isManual}
              selectedPos={selectedPos}
              onSelectPos={togglePos}
            />

            {/* Main content */}
            <main className="flex-1 overflow-y-auto">
              <div className="px-4 pt-5 pb-48 md:px-6 md:pt-6 md:pb-10">

                {/* ── Top controls row ── */}
                <div style={{ display: 'flex', flexWrap: 'wrap', alignItems: 'center', justifyContent: 'space-between', gap: 10, marginBottom: 18 }}>

                  {/* Mode toggle */}
                  <div style={{ display: 'flex', background: '#F1F5F9', borderRadius: 12, padding: 4, gap: 2 }}>
                    {[
                      { key: 'auto',   icon: '⚡', label: 'Auto Analysis'   },
                      { key: 'manual', icon: '✏️', label: 'Manual Practice' },
                    ].map(({ key, icon, label }) => {
                      const active = mode === key;
                      return (
                        <button key={key} onClick={() => switchMode(key)} style={{
                          padding: '8px 18px', borderRadius: 9, border: 'none',
                          background: active ? '#fff' : 'transparent',
                          color:      active ? '#4338CA' : '#64748B',
                          fontWeight: active ? 700 : 500, fontSize: 13,
                          boxShadow:  active ? '0 1px 4px rgba(0,0,0,0.1)' : 'none',
                          cursor: 'pointer', transition: 'all 0.15s', fontFamily: 'inherit',
                        }}>
                          {icon} {label}
                        </button>
                      );
                    })}
                  </div>

                  {/* Example loader */}
                  <select
                    onChange={loadExample}
                    defaultValue=""
                    style={{
                      fontSize: 12, background: '#fff',
                      border: '1px solid #E2E8F0', color: '#475569',
                      borderRadius: 8, padding: '7px 12px', cursor: 'pointer', outline: 'none',
                      fontFamily: 'inherit',
                    }}
                  >
                    <option value="" disabled>📂 Load example text…</option>
                    {EXAMPLES.map((ex, i) => <option key={i} value={i}>{ex.label}</option>)}
                  </select>
                </div>

                {/* ── Hint banner ── */}
                <div style={{
                  background: isManual ? '#FFF7ED' : '#EFF6FF',
                  border: `1px solid ${isManual ? '#FED7AA' : '#BFDBFE'}`,
                  borderRadius: 12, padding: '10px 14px', marginBottom: 16,
                  fontSize: 12, color: isManual ? '#7C2D12' : '#1D4ED8', lineHeight: 1.55,
                }}>
                  {isManual
                    ? <><strong>✏️ Manual Practice:</strong> Select a POS category in the legend, then click words to label them. Press "Check Answers" when done.</>
                    : <><strong>⚡ Auto Analysis:</strong> Type or paste English text, then click "Analyze" to automatically highlight each part of speech.</>
                  }
                </div>

                {/* ── Text input card ── */}
                <div style={{
                  background: '#fff', borderRadius: 16,
                  border: '1px solid #E2E8F0',
                  boxShadow: '0 1px 4px rgba(0,0,0,0.05)',
                  padding: '16px 18px', marginBottom: 14,
                }}>
                  <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 10 }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                      <label style={{ fontSize: 13, fontWeight: 700, color: '#334155' }}>English Text</label>
                      {/* "Analyzed" badge — shown after successful analysis */}
                      {analyzed && (
                        <span style={{
                          fontSize: 10, fontWeight: 700, padding: '2px 8px', borderRadius: 20,
                          background: '#DCFCE7', color: '#166534', border: '1px solid #BBF7D0',
                        }}>
                          ✓ Analyzed
                        </span>
                      )}
                    </div>
                    <span style={{ fontSize: 11, color: '#94A3B8' }}>{text.length} chars</span>
                  </div>
                  <textarea
                    value={text}
                    onChange={handleTextChange}
                    placeholder="Type or paste English text here…"
                    rows={4}
                    onFocus={e => e.target.style.borderColor = '#818CF8'}
                    onBlur={e  => e.target.style.borderColor = '#E2E8F0'}
                    style={{
                      width: '100%', borderRadius: 12,
                      border: '1.5px solid #E2E8F0',
                      background: '#F8FAFC',
                      padding: '12px 14px',
                      fontSize: 16, lineHeight: 1.7,
                      color: '#1E293B',
                      resize: 'vertical',
                      fontFamily: 'inherit',
                      boxSizing: 'border-box',
                      transition: 'border-color 0.15s',
                    }}
                  />
                </div>

                {/* ── Action buttons ── */}
                <div style={{ display: 'flex', flexWrap: 'wrap', alignItems: 'center', gap: 10, marginBottom: 22 }}>

                  {!isManual ? (
                    <button
                      disabled={!canAnalyze}
                      onClick={handleAnalyze}
                      style={btnPrimary(canAnalyze)}
                    >
                      {analyzed ? '⚡ Re-analyze' : '⚡ Analyze'}
                    </button>
                  ) : (
                    <>
                      <button disabled={!canAnalyze} style={btnSuccess(canAnalyze)}>
                        ✓ Check Answers
                      </button>
                      <button style={btnOutline}>✕ Clear All</button>
                    </>
                  )}

                  {/* Show / Hide Labels (auto mode only — manual will have its own later) */}
                  {!isManual && (
                    <button
                      onClick={() => setShowLabels(v => !v)}
                      style={{
                        ...btnOutline,
                        background:  showLabels ? '#F0FDF4' : '#fff',
                        color:       showLabels ? '#166534' : '#475569',
                        borderColor: showLabels ? '#86EFAC' : '#E2E8F0',
                        display: 'flex', alignItems: 'center', gap: 6,
                      }}
                    >
                      {showLabels ? '🏷️ Hide Labels' : '👁️ Show Labels'}
                    </button>
                  )}

                  {/* Score counter — manual mode */}
                  {isManual && (
                    <div style={{
                      marginLeft: 'auto',
                      background: '#F8FAFC', border: '1px solid #E2E8F0',
                      borderRadius: 10, padding: '8px 16px',
                      fontSize: 13, color: '#64748B',
                      display: 'flex', alignItems: 'center', gap: 5,
                    }}>
                      <strong style={{ color: '#1E293B', fontSize: 15 }}>0</strong>
                      <span style={{ color: '#CBD5E1' }}>/</span>
                      <strong style={{ color: '#1E293B', fontSize: 15 }}>0</strong>
                      <span>correct</span>
                    </div>
                  )}
                </div>

                {/* ── NLP error ── */}
                {nlpError && (
                  <div style={{
                    background: '#FEF2F2', border: '1px solid #FECACA',
                    borderRadius: 12, padding: '10px 14px', marginBottom: 16,
                    fontSize: 12, color: '#991B1B',
                  }}>
                    ⚠️ {nlpError}
                  </div>
                )}

                {/* ══ OUTPUT / RESULT AREA ══════════════════════ */}
                <div style={{
                  background: '#fff', borderRadius: 16,
                  border: analyzed ? '1.5px solid #E2E8F0' : '2px dashed #E2E8F0',
                  boxShadow: analyzed ? '0 1px 4px rgba(0,0,0,0.05)' : 'none',
                  minHeight: 150,
                  transition: 'border 0.2s',
                }}>

                  {/* ── Analyzed: render coloured tokens ── */}
                  {analyzed && tokens.length > 0 ? (
                    <div style={{ padding: '20px 22px' }}>
                      {/* Token stream */}
                      <div style={{
                        fontSize: 16,
                        // Extra line-height when labels are visible so rt text doesn't
                        // collide with the line above
                        lineHeight: showLabels ? 3.0 : 2.0,
                        wordSpacing: '1px',
                      }}>
                        {tokens.map(t => (
                          <React.Fragment key={t.id}>
                            {t.pre  && <span>{t.pre}</span>}
                            <WordToken
                              text={t.text}
                              pos={t.pos}
                              isPunct={t.isPunct}
                              unlocked={unlocked}
                              showLabels={showLabels}
                            />
                            {t.post && <span>{t.post}</span>}
                          </React.Fragment>
                        ))}
                      </div>

                      {/* Stats bar */}
                      <AnalysisStats tokens={tokens} unlocked={unlocked} />
                    </div>

                  ) : (
                    /* ── Placeholder ── */
                    <div style={{ padding: 28, display: 'flex', alignItems: 'center', justifyContent: 'center', minHeight: 150 }}>
                      {canAnalyze ? (
                        <div style={{ textAlign: 'center' }}>
                          <div style={{ fontSize: 40, marginBottom: 12 }}>{isManual ? '✏️' : '⚡'}</div>
                          <p style={{ color: '#94A3B8', fontSize: 14, margin: 0, lineHeight: 1.6 }}>
                            {isManual
                              ? <>Select a POS category from the legend,<br />then click words to label them.</>
                              : <>Click <strong style={{ color: '#6366F1' }}>"Analyze"</strong> to highlight parts of speech.</>
                            }
                          </p>
                        </div>
                      ) : (
                        <div style={{ textAlign: 'center' }}>
                          <div style={{ fontSize: 40, marginBottom: 12 }}>📝</div>
                          <p style={{ color: '#CBD5E1', fontSize: 14, margin: 0 }}>
                            Enter text above or load an example to get started.
                          </p>
                        </div>
                      )}
                    </div>
                  )}
                </div>

              </div>
            </main>
          </div>

          {/* ══ MOBILE LEGEND BAR ═══════════════════════════════ */}
          <MobileBar
            unlocked={unlocked}
            isManual={isManual}
            selectedPos={selectedPos}
            onSelectPos={togglePos}
          />

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
