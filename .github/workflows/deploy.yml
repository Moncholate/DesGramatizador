name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Para poder relanzar el despliegue sin ensuciar el historial con un commit
  # vacío. Question Lab y Grammar HUB ya lo tenían; el día que a Grammaster se
  # le quedó una ejecución colgada, no tenerlo fue lo que obligó a inventar un
  # commit para volver a disparar el workflow.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install
        working-directory: pos-highlighter

      # Los 173 tests antes de construir, como en las otras tres apps.
      # `npm run lint` NO entra todavía: hoy sale con 14 errores (variables sin
      # usar, casi todos en los tests) y meterlo aquí sin limpiarlo antes
      # bloquearía cualquier publicación por algo que no afecta al alumno.
      - name: Las pruebas
        run: npm test
        working-directory: pos-highlighter

      - name: Build
        run: npm run build
        working-directory: pos-highlighter

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pos-highlighter/dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
